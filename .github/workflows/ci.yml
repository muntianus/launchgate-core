name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Go Test & Build
    runs-on: [self-hosted, linux, x64, hostinger-vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify single entrypoint
        run: |
          mains=$(go list -f '{{if eq .Name "main"}}{{.Dir}}{{end}}' ./... | grep . || true)
          printf 'main packages:\n%s\n' "${mains:-<none>}"
          if [ "$mains" != "$PWD/cmd/launchgate" ]; then
            echo "::error::expected exactly one entrypoint (cmd/launchgate), got: ${mains:-<none>}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run Unit Tests
        env:
          RACE: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "$RACE" = "true" ]; then set -- -race; fi
          go test -v "$@" ./...

      - name: Build CLI & Microservice
        run: |
          go build -o bin/launchgate ./cmd/launchgate
          ./bin/launchgate evaluate --p95 320 --error-rate 0.002 --rps 150 --policy globlex-b2b
