name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Go Test & Build
    runs-on: [self-hosted, linux, x64, hostinger-vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Build CLI & Microservice
        run: |
          go build -o bin/launchgate ./cmd/launchgate
          ./bin/launchgate evaluate --p95 320 --error-rate 0.002 --rps 150 --policy globlex-b2b
