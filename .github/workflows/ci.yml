name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Go Test & Build
    runs-on: [self-hosted, linux, x64, hostinger-vps]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.22"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      - name: Verify single entrypoint
        run: |
          mains=$(go list -f '{{if eq .Name "main"}}{{.Dir}}{{end}}' ./... | grep . || true)
          printf 'main packages:\n%s\n' "${mains:-<none>}"
          if [ "$mains" != "$PWD/cmd/launchgate" ]; then
            echo "::error::expected exactly one entrypoint (cmd/launchgate), got: ${mains:-<none>}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run Unit Tests
        env:
          RACE: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "$RACE" = "true" ]; then set -- -race; fi
          go test -v "$@" ./...

      - name: Build CLI & Microservice
        run: |
          go build -o bin/launchgate ./cmd/launchgate
          ./bin/launchgate evaluate --p95 320 --error-rate 0.002 --rps 150 --policy globlex-b2b

